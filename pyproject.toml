[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartsim"
version = "0.1.0"
description = "Audio to simulated-membrane-pattern pipeline with independent verification of results"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "psutil"]

[project.scripts]
heartsim = "heartsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: tests that take more than a few seconds (deselect with -m 'not slow')"]
